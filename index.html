<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F3F0E8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="静听"><link rel="manifest" href="manifest.webmanifest"><title>静听</title><style>
:root{--bg:#F3F0E8;--card:#FFFDF8;--text:#252522;--sub:#6E6B64;--line:#D8D2C6;--accent:#315F55;--accentText:#fff;--font:24px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{padding:14px 12px 116px;max-width:820px;margin:auto}h1{margin:4px 2px 12px;font-size:30px}.card,.setting{background:var(--card);border:1px solid var(--line);border-radius:20px}.card{overflow:hidden}textarea{width:100%;height:58vh;min-height:360px;border:0;outline:0;resize:none;background:transparent;color:var(--text);padding:20px 18px;font:var(--font)/1.8 inherit}.status{border-top:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;color:var(--sub);font-size:13px}.actions,.dock{display:flex;gap:10px}.actions{margin-top:12px}.actions button,.dock button{flex:1}button,select,input{font:inherit}button{min-height:58px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:650}.primary{background:var(--accent);color:var(--accentText);border-color:transparent}.settings{display:grid;gap:10px;margin-top:12px}.setting{padding:12px 14px}label{display:block;color:var(--sub);font-size:13px;margin-bottom:8px}select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}.row{display:flex;align-items:center;gap:10px}.row input{flex:1}.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(243,240,232,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line)}@media(prefers-color-scheme:dark){:root{--bg:#171816;--card:#232420;--text:#F3F0E9;--sub:#B8B3A8;--line:#41423B;--accent:#8BB8AA;--accentText:#10211B}.dock{background:rgba(23,24,22,.92)}}
</style></head><body><main><h1>静听</h1><section class="card"><textarea id="text" spellcheck="false" placeholder="粘贴文字到这里。点到任意位置或选中文字，然后点‘从这里开始’。"></textarea><div class="status"><span id="status">准备就绪</span><span id="pos">0 / 0</span></div></section><div class="actions"><button id="from" class="primary">↪ 从这里开始</button><button id="stop">■ 停止</button></div><section class="settings"><div class="setting"><label>声音</label><select id="voice"><option>正在读取系统声音…</option></select></div><div class="setting"><label>语速</label><div class="row"><input id="rate" type="range" min=".5" max="2" step=".05" value="1"><span id="rateV">1.00×</span></div></div><div class="setting"><label>字号</label><div class="row"><input id="font" type="range" min="18" max="40" step="1" value="24"><span id="fontV">24px</span></div></div></section></main><div class="dock"><button id="play" class="primary">▶ 开始 / 继续</button><button id="pause">⏸ 暂停</button></div><script>
(()=>{const s=speechSynthesis,$=id=>document.getElementById(id),t=$("text"),st=$("status"),p=$("pos"),vsel=$("voice"),r=$("rate"),f=$("font");let vs=[],chunks=[],i=0,cur=0,token=0,manual=false,saved="";const K="jingting-ios-v2";function ui(){document.documentElement.style.setProperty("--font",f.value+"px");$("rateV").textContent=(+r.value).toFixed(2)+"×";$("fontV").textContent=f.value+"px";p.textContent=Math.min(cur,t.value.length)+" / "+t.value.length}function save(){localStorage.setItem(K,JSON.stringify({text:t.value,cur,rate:+r.value,font:+f.value,voice:vs[+vsel.value]?.voiceURI||saved}))}function load(){try{let x=JSON.parse(localStorage.getItem(K)||"{}");t.value=x.text||"";cur=Math.min(x.cur||0,t.value.length);if(x.rate)r.value=x.rate;if(x.font)f.value=x.font;saved=x.voice||""}catch{}ui()}function voices(){vs=s.getVoices();if(!vs.length)return;let a=vs.map((v,i)=>({v,i})).sort((a,b)=>(/^zh/i.test(a.v.lang)?0:1)-(/^zh/i.test(b.v.lang)?0:1));vsel.innerHTML="";a.forEach(({v,i})=>{let o=document.createElement("option");o.value=i;o.textContent=v.name+" · "+v.lang;vsel.appendChild(o)});let c=a[0]?.i||0,fi=vs.findIndex(v=>v.voiceURI===saved);if(fi>=0)c=fi;vsel.value=String(c)}function split(x,start){let out=[],q=start;while(q<x.length){while(q<x.length&&/\s/.test(x[q]))q++;if(q>=x.length)break;let e=Math.min(q+180,x.length);if(e<x.length){let z=x.slice(q,e),best=-1;for(let m of ["。","！","？","；","\n",". ","! ","? "])best=Math.max(best,z.lastIndexOf(m));if(best>35)e=q+best+1}out.push({t:x.slice(q,e),s:q,e});q=e}return out}function speakFrom(start){if(!t.value.trim()){st.textContent="请先粘贴文字";return}token++;s.cancel();manual=false;cur=Math.max(0,Math.min(start,t.value.length));chunks=split(t.value,cur);i=0;ui();save();let my=token;setTimeout(()=>next(my),50)}function next(my){if(my!==token||manual)return;if(i>=chunks.length){cur=t.value.length;st.textContent="朗读完成";ui();save();return}let c=chunks[i],u=new SpeechSynthesisUtterance(c.t),vv=vs[+vsel.value];if(vv){u.voice=vv;u.lang=vv.lang}u.rate=+r.value;u.onstart=()=>{if(my===token)st.textContent="正在朗读"};u.onboundary=e=>{if(my===token&&typeof e.charIndex==="number"){cur=Math.min(c.s+e.charIndex,t.value.length);ui();save()}};u.onend=()=>{if(my!==token||manual)return;cur=c.e;i++;ui();save();next(my)};u.onerror=e=>{if(my===token&&!['canceled','interrupted'].includes(e.error))st.textContent="朗读失败，请换一个声音再试"};s.speak(u)}$("play").onclick=()=>{if(s.paused){s.resume();st.textContent="正在朗读"}else if(!s.speaking)speakFrom(cur>=t.value.length?0:cur)};$("pause").onclick=()=>{if(s.speaking&&!s.paused){s.pause();st.textContent="已暂停";save()}};$("stop").onclick=()=>{manual=true;token++;s.cancel();st.textContent="已停止";save()};$("from").onclick=()=>{cur=Math.min(t.selectionStart||0,t.selectionEnd||0);speakFrom(cur)};t.oninput=()=>{cur=Math.min(cur,t.value.length);ui();save()};r.oninput=()=>{ui();save()};f.oninput=()=>{ui();save()};vsel.onchange=save;load();voices();s.onvoiceschanged=voices;setTimeout(voices,400);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
