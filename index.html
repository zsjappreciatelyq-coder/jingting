<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F3F0E8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="静听"><link rel="manifest" href="./manifest.webmanifest"><title>静听</title><style>
:root{--bg:#F3F0E8;--card:#FFFDF8;--text:#252522;--sub:#6E6B64;--line:#D8D2C6;--green:#315F55;--green2:#3B6F63;--white:#fff;--fontSize:24px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:820px;margin:auto;padding:14px 12px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 2px 12px}h1{margin:0;font-size:30px}.clearBtn{min-height:42px;padding:0 15px;border-radius:13px}.card,.setting{background:var(--card);border:1px solid var(--line);border-radius:20px}.card{overflow:hidden}textarea{display:block;width:100%;height:58vh;min-height:360px;border:0;outline:0;resize:none;background:transparent;color:var(--text);padding:20px 18px;font-family:inherit;font-size:var(--fontSize);line-height:1.8;caret-color:var(--green)}textarea::placeholder{color:var(--sub)}.status{border-top:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;gap:10px;color:var(--sub);font-size:13px}.settings{display:grid;gap:10px;margin-top:12px}.setting{padding:12px 14px}label{display:block;color:var(--sub);font-size:13px;margin-bottom:8px}select,input,button{font:inherit}select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);padding:6px 10px}.row{display:flex;align-items:center;gap:10px}.row input{flex:1}.value{min-width:58px;text-align:right;font-variant-numeric:tabular-nums}.dock{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(243,240,232,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:20}.dock button{flex:1;min-height:60px}button{border:0;background:var(--green);color:var(--white);font-weight:700;cursor:pointer}button:active{background:var(--green2);transform:translateY(1px)}@media(prefers-color-scheme:dark){:root{--bg:#171816;--card:#232420;--text:#F3F0E9;--sub:#B8B3A8;--line:#41423B;--green:#6FA99A;--green2:#5E9789;--white:#10211B}.dock{background:rgba(23,24,22,.94)}}
</style></head><body><main><div class="top"><h1>静听</h1><button id="clear" class="clearBtn">清空全部</button></div><section class="card"><textarea id="text" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="把文字粘贴到这里。\n\n想从某处重新听：点到那个位置，或选中文字，然后点“从这里开始”。"></textarea><div class="status"><span id="status">准备就绪</span><span id="pos">0 / 0</span></div></section><section class="settings"><div class="setting"><label for="voice">声音</label><select id="voice"><option>正在读取系统声音…</option></select></div><div class="setting"><label for="rate">语速</label><div class="row"><input id="rate" type="range" min="0.5" max="2" step="0.05" value="1"><span id="rateV" class="value">1.00×</span></div></div><div class="setting"><label for="font">字号</label><div class="row"><input id="font" type="range" min="18" max="40" step="1" value="24"><span id="fontV" class="value">24px</span></div></div></section></main><div class="dock"><button id="from">从这里开始</button><button id="toggle">继续</button></div><script>
(()=>{const $=id=>document.getElementById(id),t=$("text"),st=$("status"),p=$("pos"),vsel=$("voice"),r=$("rate"),f=$("font"),toggle=$("toggle");const synth=('speechSynthesis'in window)?window.speechSynthesis:null;let vs=[],chunks=[],i=0,cur=0,token=0,manual=false,savedVoice='',lastSelection=0;const K='jingting-ios-v3';
function ui(){document.documentElement.style.setProperty('--fontSize',f.value+'px');$("rateV").textContent=(+r.value).toFixed(2)+'×';$("fontV").textContent=f.value+'px';p.textContent=Math.min(cur,t.value.length)+' / '+t.value.length}
function setToggle(){if(!synth){toggle.textContent='继续';return}toggle.textContent=(synth.speaking&&!synth.paused)?'暂停':'继续'}
function save(){try{localStorage.setItem(K,JSON.stringify({text:t.value,cur,rate:+r.value,font:+f.value,voice:vs[+vsel.value]?.voiceURI||savedVoice}))}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem(K)||'{}');t.value=x.text||'';cur=Math.min(x.cur||0,t.value.length);lastSelection=cur;if(x.rate)r.value=x.rate;if(x.font)f.value=x.font;savedVoice=x.voice||''}catch(e){}ui();setToggle()}
function loadVoices(){if(!synth)return;vs=synth.getVoices();if(!vs.length)return;const a=vs.map((v,i)=>({v,i})).sort((a,b)=>{const az=/^zh/i.test(a.v.lang)?0:1,bz=/^zh/i.test(b.v.lang)?0:1;return az-bz||a.v.name.localeCompare(b.v.name)});vsel.innerHTML='';a.forEach(({v,i})=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+' · '+v.lang;vsel.appendChild(o)});let chosen=a[0]?.i||0;const found=vs.findIndex(v=>v.voiceURI===savedVoice);if(found>=0)chosen=found;vsel.value=String(chosen)}
function split(x,start){const out=[];let q=start;while(q<x.length){while(q<x.length&&/\s/.test(x[q]))q++;if(q>=x.length)break;let e=Math.min(q+180,x.length);if(e<x.length){const z=x.slice(q,e);let best=-1;for(const m of ['。','！','？','；','\n','. ','! ','? '])best=Math.max(best,z.lastIndexOf(m));if(best>35)e=q+best+1}out.push({t:x.slice(q,e),s:q,e});q=e}return out}
function speakFrom(start){if(!synth){st.textContent='当前环境不支持朗读';return}if(!t.value.trim()){st.textContent='请先粘贴文字';return}token++;manual=true;synth.cancel();manual=false;cur=Math.max(0,Math.min(start,t.value.length));chunks=split(t.value,cur);i=0;ui();save();setToggle();const my=token;setTimeout(()=>next(my),60)}
function next(my){if(my!==token||manual||!synth)return;if(i>=chunks.length){cur=t.value.length;st.textContent='朗读完成';ui();save();setToggle();return}const c=chunks[i],u=new SpeechSynthesisUtterance(c.t),vv=vs[+vsel.value];if(vv){u.voice=vv;u.lang=vv.lang}u.rate=+r.value;u.onstart=()=>{if(my===token){st.textContent='正在朗读';setToggle()}};u.onboundary=e=>{if(my===token&&typeof e.charIndex==='number'){cur=Math.min(c.s+e.charIndex,t.value.length);ui();save()}};u.onend=()=>{if(my!==token||manual)return;cur=c.e;i++;ui();save();next(my)};u.onerror=e=>{if(my===token&&!['canceled','interrupted'].includes(e.error)){st.textContent='朗读失败，请换一个声音再试';setToggle()}};synth.speak(u);setTimeout(setToggle,80)}
function togglePlay(){if(!synth){st.textContent='当前环境不支持朗读';return}if(synth.speaking&&!synth.paused){synth.pause();st.textContent='已暂停';setToggle();save();return}if(synth.paused){synth.resume();st.textContent='正在朗读';setToggle();return}speakFrom(cur>=t.value.length?0:cur)}
function updateSelection(){const x=typeof t.selectionStart==='number'?Math.min(t.selectionStart,t.selectionEnd):0;lastSelection=x}
$("from").onclick=()=>{updateSelection();cur=lastSelection;speakFrom(cur)};toggle.onclick=togglePlay;$("clear").onclick=()=>{if(synth){manual=true;token++;synth.cancel();manual=false}t.value='';cur=0;lastSelection=0;chunks=[];i=0;st.textContent='已清空';ui();setToggle();save();t.focus()};t.addEventListener('input',()=>{cur=Math.min(cur,t.value.length);updateSelection();ui();save()});for(const ev of ['click','select','keyup','touchend'])t.addEventListener(ev,updateSelection);r.oninput=()=>{ui();save()};f.oninput=()=>{ui();save()};vsel.onchange=save;load();if(synth){loadVoices();synth.onvoiceschanged=loadVoices;setTimeout(loadVoices,350)}else{st.textContent='当前环境不支持系统朗读'}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
